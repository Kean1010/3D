<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Singapore Chicken Rice 3D Showcase (FBX)</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; height: 100%; background: #f8f8f8;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #storyPanel {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 900px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 1.2em;
      line-height: 1.4em;
      text-align: center;
      pointer-events: none; /* let 3D controls work */
      opacity: 1;
      transition: opacity 1s ease-in-out;
      user-select: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="storyPanel"></div>

  <!-- Three.js and FBXLoader -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


  
  <script>
    const stories = [
      {
        text: "Origins: Hainanese chicken rice was brought to Singapore by Chinese immigrants from Hainan, China. The dish evolved from the traditional 'Wenchang chicken' of Hainan, adapted to local tastes and ingredients.",
        audio: "audio1.mp3"
      },
      {
        text: "Evolution in Singapore: Over the decades, chicken rice became a national icon. Hawkers developed their own styles, perfecting fragrant rice cooked in chicken broth and tender poached chicken served with chili sauce.",
        audio: "audio2.mp3"
      },
      {
        text: "Cultural Significance: Today, chicken rice is more than food — it is a comfort dish, a symbol of Singapore's multicultural identity, and a must-try for visitors from around the world.",
        audio: "audio3.mp3"
      }
    ];

    const container = document.getElementById('container');
    const storyPanel = document.getElementById('storyPanel');

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Load FBX model
    const loader = new THREE.FBXLoader();
    loader.load('Hainanese_Chicken_Rice.fbx', function(fbx) {
      fbx.scale.set(0.02, 0.02, 0.02);  // Adjust scale as needed
      scene.add(fbx);
    }, undefined, function(error) {
      console.error('Error loading FBX:', error);
    });

    camera.position.set(0, 1.5, 3);

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Audio & Story sequence with fade effect on captions
    let currentIndex = 0;
    let audio = null;

    function fadeOutText(callback) {
      storyPanel.style.opacity = 0;
      setTimeout(callback, 1000);
    }

    function fadeInText(text) {
      storyPanel.innerText = text;
      storyPanel.style.opacity = 1;
    }

    function playStory(index) {
      if (index >= stories.length) {
        // End of story, you could loop or stop
        return;
      }
      fadeOutText(() => {
        fadeInText(stories[index].text);
        if (audio) {
          audio.pause();
          audio = null;
        }
        audio = new Audio(stories[index].audio);
        audio.play();
        audio.onended = () => {
          playStory(index + 1);
        };
      });
    }

    // Start automatically on page load
    window.addEventListener('load', () => {
      fadeInText(stories[0].text);
      audio = new Audio(stories[0].audio);
      audio.play();
      audio.onended = () => {
        playStory(1);
      };
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
