<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Singapore Chicken Rice 3D Showcase</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #f8f8f8;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #storyPanel {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.1em;
      line-height: 1.4em;
      text-align: center;
      pointer-events: none; /* so it won't block model controls */
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="storyPanel"></div>

  <!-- Three.js + GLTF Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Story data (text + audio files)
    const stories = [
      {
        text: "Origins: Hainanese chicken rice was brought to Singapore by Chinese immigrants from Hainan, China. The dish evolved from the traditional 'Wenchang chicken' of Hainan, adapted to local tastes and ingredients.",
        audio: "audio1.mp3"
      },
      {
        text: "Evolution in Singapore: Over the decades, chicken rice became a national icon. Hawkers developed their own styles, perfecting fragrant rice cooked in chicken broth and tender poached chicken served with chili sauce.",
        audio: "audio2.mp3"
      },
      {
        text: "Cultural Significance: Today, chicken rice is more than food — it is a comfort dish, a symbol of Singapore's multicultural identity, and a must-try for visitors from around the world.",
        audio: "audio3.mp3"
      }
    ];

    const container = document.getElementById('container');
    const storyPanel = document.getElementById('storyPanel');

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(light);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Load model (keep your original filename here)
    const loader = new THREE.GLTFLoader();
    loader.load('chickenrice.glb', function(gltf) {
      const model = gltf.scene;
      model.scale.set(2, 2, 2);
      scene.add(model);
    }, undefined, function(error) {
      console.error(error);
    });

    camera.position.set(0, 1.5, 3);

    // Handle resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Auto-play story + audio
    let currentIndex = 0;
    function playStory(index) {
      if (index >= stories.length) return;

      storyPanel.innerHTML = stories[index].text;
      const audio = new Audio(stories[index].audio);
      audio.play();
      audio.onended = () => {
        playStory(index + 1);
      };
    }

    // Start sequence automatically
    window.addEventListener('load', () => {
      playStory(0);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
