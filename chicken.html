<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Singapore Chicken Rice Showcase</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #viewer-container {
      flex: 1;
      position: relative;
      background-color: #fff;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #fff;
    }

    /* Caption box overlay */
    #caption-box {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      background: rgba(255, 255, 255, 0.85);
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.4em;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
      text-align: center;
    }

    #caption-title {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div id="viewer-container">
    <!-- 3D model -->
    <model-viewer 
      id="model" 
      src="chickenrice.glb" 
      alt="Singapore Chicken Rice" 
      camera-controls 
      auto-rotate 
      rotation-per-second="15deg"
      exposure="1"
      shadow-intensity="1">
    </model-viewer>

    <!-- Caption overlay -->
    <div id="caption-box">
      <div id="caption-title"></div>
      <div id="caption-text"></div>
    </div>
  </div>

  <script>
    // Story data: title, text, audio
    const storySections = [
      {
        title: "Origins",
        text: "Hainanese chicken rice originated from Chinese immigrants from Hainan, China. The dish was adapted in Singapore using local ingredients and techniques, making it lighter and more fragrant.",
        audio: "origins.mp3"
      },
      {
        title: "Evolution in Singapore",
        text: "Over the decades, Singapore's version evolved into a national dish. Poached or roasted chicken is served with fragrant rice cooked in chicken stock, accompanied by chili sauce and ginger paste.",
        audio: "evolution.mp3"
      },
      {
        title: "Cultural Significance",
        text: "Chicken rice is more than a meal — it is part of Singapore's cultural identity, enjoyed in hawker centres and restaurants alike, symbolizing comfort and tradition.",
        audio: "cultural.mp3"
      }
    ];

    const captionTitle = document.getElementById("caption-title");
    const captionText = document.getElementById("caption-text");

    let currentSection = 0;

    function playSection(index) {
      if (index >= storySections.length) return;
      const section = storySections[index];
      captionTitle.textContent = section.title;
      captionText.textContent = section.text;

      const audio = new Audio(section.audio);
      audio.play();

      audio.onended = () => {
        playSection(index + 1);
      };
    }

    // Start playing automatically after short delay (so model loads)
    window.addEventListener("load", () => {
      setTimeout(() => {
        playSection(0);
      }, 1000);
    });
  </script>
</body>
</html>
