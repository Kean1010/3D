<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Dishes 3D Showcase v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 95vw;
            height: 70vh;
            max-width: 1000px;
            border: 2px solid #4b5e8e;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            background: #ffffff10;
            position: relative;
            margin-top: 20px;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0-motif: none;
        }
        #model-info {
            margin-top: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        #model-selector {
            margin-top: 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            padding-bottom: 20px;
        }
        .model-card {
            width: 100px;
            height: 100px;
            background: #ffffff10;
            border: 2px solid #4b5e8e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
        }
        .model-card:hover {
            transform: scale(1.05);
            border-color: #60a5fa;
        }
        .model-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 6px solid #f3f3f3;
            border-top: 6px solid #60a5fa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }
        #storyPanel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4em;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @media (max-width: 600px) {
            #info, #model-info, #storyPanel {
                font-size: 12px;
                padding: 8px 12px;
            }
            #canvas-container {
                width: 98vw;
                height: 65vh;
            }
            .model-card {
                width: 80px;
                height: 80px;
            }
            #startOverlay {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="viewer-canvas"></canvas>
        <div id="loading-spinner"></div>
        <div id="storyPanel"></div>
        <div id="startOverlay">Click anywhere to start the story</div>
    </div>
    <div id="info">
        <p class="font-bold">3D Model Viewer (Mobile)</p>
        <p>Rotate: Swipe with one finger</p>
        <p>Pan: Swipe with two fingers</p>
        <p>Zoom: Pinch to zoom</p>
    </div>
    <div id="model-info"></div>
    <div id="model-selector">
        <div class="model-card" data-folder="assets/model1" data-model="3DModel" data-image="thumb1.jpg" data-name="Nasi Lemak">
            <img src="thumb1.jpg" alt="Nasi Lemak">
        </div>
        <div class="model-card" data-folder="assets/model2" data-model="3DModel" data-image="thumb2.jpg" data-name="Chicken Rice">
            <img src="thumb2.jpg" alt="Chicken Rice">
        </div>
        <div class="model-card" data-folder="assets/model3" data-model="3DModel" data-image="thumb3.jpg" data-name="Nasi Briyani">
            <img src="thumb3.jpg" alt="Nasi Briyani">
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Check if THREE is defined
        if (typeof THREE === 'undefined') {
            console.error('Three.js failed to load. Check the network or CDN availability.');
            alert('Failed to load Three.js. Please check your internet connection.');
        } else {
            console.log('Three.js loaded successfully:', THREE.REVISION);
        }

        // Story data
        const stories = {
            'assets/model1': {
                text: "Nasi Lemak History: Originating from Malaysia, Nasi Lemak is a fragrant rice dish cooked in coconut milk and pandan leaves, often served with sambal, anchovies, peanuts, and cucumber. It has become a beloved dish in Singapore, reflecting the region's Malay heritage.",
                audio: "assets/story/nasi_lemak.mp3"
            },
            'assets/model2': {
                text: "Origins: Hainanese chicken rice was brought to Singapore by Chinese immigrants from Hainan, China. The dish evolved from the traditional 'Wenchang chicken' of Hainan, adapted to local tastes and ingredients.",
                audio: "assets/story/chicken_rice.mp3"
            },
            'assets/model3': {
                text: "Nasi Briyani Facts: A flavorful rice dish of Indian origin, Nasi Briyani is popular in Singapore's Indian-Muslim community. It is cooked with aromatic spices like saffron and cardamom, often paired with tender meat or vegetables.",
                audio: "assets/story/nasi_briyani.mp3"
            }
        };

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('viewer-canvas') });
        const container = document.getElementById('canvas-container');
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Camera position
        camera.position.set(0, 1, 1);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(2, 2, 2);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-2, 1, 2);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
        rimLight.position.set(0, 2, -2);
        scene.add(rimLight);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Model info and state
        const modelInfo = document.getElementById('model-info');
        const storyPanel = document.getElementById('storyPanel');
        const overlay = document.getElementById('startOverlay');
        let currentObject = null;
        const spinner = document.getElementById('loading-spinner');
        let audio = null;

        // Load model function
        function loadModel(folder, modelName) {
            spinner.style.display = 'block';
            if (currentObject) {
                scene.remove(currentObject);
                currentObject = null;
            }

            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.setResourcePath(`${folder}/`);
            mtlLoader.load(
                `${folder}/${modelName}.mtl`,
                (materials) => {
                    materials.preload();
                    console.log(`MTL loaded for ${folder}/${modelName}:`, materials);
                    const objLoader = new THREE.OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load(
                        `${folder}/${modelName}.obj`,
                        (object) => {
                            object.scale.set(1.5, 1.5, 1.5);
                            const box = new THREE.Box3().setFromObject(object);
                            const center = box.getCenter(new THREE.Vector3());
                            object.position.sub(center);
                            scene.add(object);
                            currentObject = object;
                            spinner.style.display = 'none';
                            const key = `${folder}/${modelName}`;
                            modelInfo.innerHTML = `<p class="font-bold">${document.querySelector(`[data-folder="${folder}"]`).getAttribute('data-name')}</p>`;
                            // Play corresponding story
                            if (audio) {
                                audio.pause();
                                audio = null;
                            }
                            storyPanel.style.opacity = 0;
                            setTimeout(() => {
                                storyPanel.innerText = stories[key].text;
                                storyPanel.style.opacity = 1;
                                audio = new Audio(stories[key].audio);
                                audio.play().catch(err => {
                                    console.warn('Audio play prevented:', err);
                                });
                            }, 1000);
                            console.log(`OBJ loaded for ${folder}/${modelName}:`, object);
                        },
                        (progress) => {
                            console.log(`OBJ loading progress for ${folder}/${modelName}: ${(progress.loaded / progress.total * 100).toFixed(2)}%`);
                        },
                        (error) => {
                            console.error(`Error loading ${folder}/${modelName}.obj:`, error);
                            spinner.style.display = 'none';
                        }
                    );
                },
                (progress) => {
                    console.log(`MTL loading progress for ${folder}/${modelName}: ${(progress.loaded / progress.total * 100).toFixed(2)}%`);
                },
                (error) => {
                    console.error(`Error loading ${folder}/${modelName}.mtl:`, error);
                    spinner.style.display = 'none';
                }
            );
        }

        // Model selector
        document.querySelectorAll('.model-card').forEach(card => {
            card.addEventListener('click', () => {
                const folder = card.getAttribute('data-folder');
                const modelName = card.getAttribute('data-model');
                loadModel(folder, modelName);
            });
        });

        // Start story on overlay click
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            const initialKey = 'assets/nasi_lemak/3DModel';
            storyPanel.innerText = stories[initialKey].text;
            storyPanel.style.opacity = 1;
            audio = new Audio(stories[initialKey].audio);
            audio.play().catch(err => {
                console.warn('Audio play prevented:', err);
            });
        });

        // Load initial model
        loadModel('assets/nasi_lemak', '3DModel');

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
